[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markovpath"
version = "2.0.1"
description = "Fast, production-ready Markov Chain library for navigation path prediction, trail likelihood estimation, AI agent trajectory modeling, and attribution."
readme = "README.md"
authors = [
  { name = "Ishan Jain", email = "visitishan@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "markov-chain",
  "path-prediction",
  "clickstream",
  "web-usage-mining",
  "attribution-modeling",
  "removal-effect",
  "agent-trajectories",
  "ai-planning",
  "link-prediction"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.20.0",
  "pandas>=1.3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "twine>=4.0.0",
  "build>=0.10.0"
]

[project.urls]
Homepage = "https://github.com/visitishan/Navigation-path-prediction-and-probability"
Repository = "https://github.com/visitishan/Navigation-path-prediction-and-probability"
"Bug Tracker" = "https://github.com/visitishan/Navigation-path-prediction-and-probability/issues"
